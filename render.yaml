databases:
  - name: dean-exam-db
    plan: free
    databaseName: dean_exam
    user: dean_exam_user

services:
  # Backend (FastAPI)
  - type: web
    name: dean-exam-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dean-exam-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.7

  # Frontend (React + Vite static site)
  - type: web
    name: dean-exam-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://dean-exam-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
